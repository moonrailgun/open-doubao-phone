[package]
name = "open-doubao-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "open_doubao_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "open-doubao-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-notification", "dep:tauri-plugin-opener"]

[build-dependencies]
tauri-build = { version = "2", optional = true, features = [] }

[dependencies]
futures-util = { version = "0.3", features = ["sink"] }
hex = "0.4"
if-addrs = "0.13"
rand = "0.8"
rcgen = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tauri = { version = "2", optional = true, features = [] }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = "0.28"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
